# Sample dataset: everyday objects in cluttered scenes (COCO val2017).
# Build settings for `python -m src.sample_data`; this folder is self-contained.

# Source.
source: hf_rows
dataset: rafaelpadilla/coco2017
config: default
split: val
max_rows: 2000            # rows scanned from the start of the split
label_field: label
labels: [dog, cat, bicycle, bus, umbrella]
license: CC BY 4.0 (COCO annotations); images under Flickr terms

# Selection and output settings.
num_probes: 20            # probe crops, split evenly across labels
num_images: 80            # full images
image_width: 1280         # every image is resized to this width, keeping aspect ratio
negative_fraction: 0.1    # share of images containing none of the labels (if the source has any)
probe_padding: 0.1        # context added around each probe box, as a fraction of box size
probe_min_side: 96        # min shorter side of a probe box, in source-image pixels
jpeg_quality: 95          # JPEG quality for saved images and probe crops
seed: 42                  # random seed for reproducible selection
